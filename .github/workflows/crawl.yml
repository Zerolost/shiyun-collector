name: Crawl language sources

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Collection frequency profile
        required: true
        default: frequent
        type: choice
        options:
          - frequent
          - daily
          - weekly

concurrency:
  group: shiyun-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python crawler/run.py --profile "${{ inputs.profile }}"
      - run: python scripts/validate_normalized.py
      - name: Clone private data repository
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
        run: |
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" /tmp/shiyun-data
      - name: Publish changed data
        env:
          DATA_REPO_DIR: /tmp/shiyun-data
        run: |
          git -C /tmp/shiyun-data config user.name "${{ github.actor }}"
          git -C /tmp/shiyun-data config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          python scripts/publish.py
      - name: Publish read-only data mirror
        run: |
          python scripts/publish_public.py
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add published
          git diff --cached --quiet || git commit -m "Publish read-only learning data mirror"
          git push origin main
